				<script>
				document.addEventListener('DOMContentLoaded', function() {
					var calendarEl = document.getElementById('calendar');

					// Mobile: day-by-day agenda list. Desktop: full week grid (unchanged).
					var mobileQuery = window.matchMedia('(max-width: 768px)');

					function toolbarFor(isMobile) {
						return isMobile
							? { left: 'prev,next', center: 'title', right: '' }
							: { left: 'title', center: '', right: '' };
					}

					// ============================================================= //
					//    SESSION CHAIRS                                              //
					//    One entry per block of talks, i.e. between two breaks,      //
					//    or between the start/end of a day and a break.              //
					//    Fill in `chair` (leave '' to display "tbd").                //
					//    If a talk moves across a break, update start/end here too.  //
					// ============================================================= //
					var sessions = [
						// Tuesday 3
						{ start: '2026-11-03T09:30:00', end: '2026-11-03T10:45:00', chair: 'Daniel Hernández' },
						{ start: '2026-11-03T11:15:00', end: '2026-11-03T12:45:00', chair: 'Stéphane Loisel' },
						{ start: '2026-11-03T14:15:00', end: '2026-11-03T15:45:00', chair: 'Anis Matoussi' },
						{ start: '2026-11-03T16:15:00', end: '2026-11-03T17:30:00', chair: 'Christa Cuchiero' },
						// Wednesday 4
						{ start: '2026-11-04T09:00:00', end: '2026-11-04T10:45:00', chair: 'Caroline Hillairet' },
						{ start: '2026-11-04T11:15:00', end: '2026-11-04T12:45:00', chair: 'Dylan Possamaï' },
						{ start: '2026-11-04T14:15:00', end: '2026-11-04T15:45:00', chair: 'Henry Panti' },
						// Thursday 5
						{ start: '2026-11-05T14:30:00', end: '2026-11-05T15:45:00', chair: 'Anthony Réveillac' },
						{ start: '2026-11-05T16:15:00', end: '2026-11-05T17:15:00', chair: 'Giorgia Callegaro' },
						// Friday 6
						{ start: '2026-11-06T09:00:00', end: '2026-11-06T10:45:00', chair: 'Thomas Peyrat' },
						{ start: '2026-11-06T11:15:00', end: '2026-11-06T13:00:00', chair: 'Mike Ludkovski' },
					];

					var TALK_CLASSES = ['ltalk', 'mtalk', 'stalk'];

					function chairName(s) {
						return (s.chair && s.chair.trim()) ? s.chair.trim() : 'tbd';
					}
					function isTalk(ev) {
						return ev.classNames.some(function (c) { return TALK_CLASSES.indexOf(c) !== -1; });
					}
					function isSession(ev) {
						return ev.classNames.indexOf('session-chair') !== -1;
					}
					function sessionOf(date) {
						var t = date.getTime();
						for (var i = 0; i < sessions.length; i++) {
							if (t >= new Date(sessions[i].start).getTime() && t < new Date(sessions[i].end).getTime()) return sessions[i];
						}
						return null;
					}
					function hhmm(d) {
						return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
					}

					// Desktop grid: background band on the left of each session.
					// Mobile list: a header row placed just before the first talk of the session.
					function sessionSource(isMobile) {
						return {
							id: 'sessions',
							events: sessions.map(function (s, i) {
								return {
									title: 'Session chair: ' + chairName(s),
									start: s.start,
									end: s.end,
									display: isMobile ? 'auto' : 'background',
									classNames: ['session-chair'],
									extendedProps: { sessionIndex: i },
								};
							}),
						};
					}

					// Shorten the vertical label if it does not fit the band:
					// "First Last" -> "F. Last" -> ellipsis.
					function fitRails() {
						document.querySelectorAll('.session-rail-name').forEach(function (el) {
							var full = el.getAttribute('data-full');
							el.textContent = full;
							var label = el.parentNode;
							if (label.scrollHeight > label.clientHeight) {
								var parts = full.split(/\s+/);
								if (parts.length > 1) el.textContent = parts[0].charAt(0) + '. ' + parts.slice(1).join(' ');
							}
						});
					}
					var fitPending = false;
					function scheduleFit() {
						if (fitPending) return;
						fitPending = true;
						setTimeout(function () { fitPending = false; fitRails(); }, 50);
					}

					function openModal(title, body) {
						document.getElementById('eventModalTitle').innerHTML = title;
						document.getElementById('eventModalBody').innerHTML = body;
						$('#eventModal').modal('show');
					}

					function openSessionModal(calendarRef, s) {
						var start = new Date(s.start), end = new Date(s.end);
						var talks = calendarRef.getEvents().filter(function (ev) {
							return isTalk(ev) && ev.start >= start && ev.start < end;
						}).sort(function (a, b) { return a.start - b.start; });
						var day = start.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
						var body = "<strong style='color:#08345b;'>Chair:</strong> " + chairName(s) + "<br><br>" +
							"<strong style='color:#08345b;'>Talks:</strong><br>" +
							talks.map(function (ev) { return hhmm(ev.start) + ' – ' + ev.title.trim(); }).join('<br>');
						openModal('Session · ' + day + ', ' + hhmm(start) + '–' + hhmm(end), body);
					}

					var calendar = new FullCalendar.Calendar(calendarEl, {
					// Desktop: only the 4 conference days (Tue-Fri), so each column is wider
					views: {
						conference: { type: 'timeGrid', duration: { days: 4 } },
					},
					initialView: mobileQuery.matches ? 'listDay' : 'conference',
					initialDate: '2026-11-03',
					validRange: { start: '2026-11-03', end: '2026-11-07' },
					headerToolbar: toolbarFor(mobileQuery.matches),
					height: mobileQuery.matches ? 'auto' : undefined,
					allDaySlot: false,
					slotMinTime: '08:00:00',
					slotMaxTime: '22:30:00',
					slotDuration: '00:15:00',
					eventSources: [ sessionSource(mobileQuery.matches) ],
					eventDidMount: function (info) {
						if (!isSession(info.event)) return;
						var s = sessions[info.event.extendedProps.sessionIndex];
						info.el.setAttribute('title', 'Session chair: ' + chairName(s));
						if (info.event.display === 'background') {
							// Vertical band in the week grid
							var rail = document.createElement('div');
							rail.className = 'session-rail';
							rail.innerHTML = "<span class='session-rail-label'><span class='session-rail-kicker'>Chair</span> " +
								"<span class='session-rail-name'></span></span>";
							var nameEl = rail.querySelector('.session-rail-name');
							nameEl.setAttribute('data-full', chairName(s));
							nameEl.textContent = chairName(s);
							rail.addEventListener('click', function () { openSessionModal(calendar, s); });
							info.el.appendChild(rail);
							scheduleFit();
						} else {
							// Header row in the mobile list
							var titleCell = info.el.querySelector('.fc-list-event-title');
							if (titleCell) {
								titleCell.innerHTML = "<span class='session-row-kicker'>Session chair</span> " +
									"<span class='session-row-name'></span>";
								titleCell.querySelector('.session-row-name').textContent = chairName(s);
							}
						}
					},
					events: [

						// ===================== //
						//    MARDI 3 NOVEMBRE    //
						// ===================== //

						{
						title: 'Opening',
						start: '2026-11-03T09:00:00',
						end: '2026-11-03T09:30:00',
						backgroundColor: '#E8E8E8',
						borderColor: '#E8E8E8',
						textColor: '#08345b',
						description: 'Auditorium',
						},
						{
						title: 'Stéphane Loisel',
						start: '2026-11-03T09:30:00',
						end: '2026-11-03T10:15:00',
						description: "<strong style='color:#08345b;'>Title:<br></strong> On some actuarial results obtained with Claude <br>"+
									" <strong style='color:#08345b;'>Abstract:<br></strong> In this talk, I will present some results obtained with Claude that are relevant for basis risk estimation in parametric risk transfers, in the context of climate change and worsening insurance risks.",
						classNames: ['ltalk'],
						},
						{
						title: 'Denys Pommeret',
						start: '2026-11-03T10:15:00',
						end: '2026-11-03T10:45:00',
						description: "<strong style='color:#08345b;'>Title:<br></strong> Beyond Correlation: Lancaster Copulas for Modeling Dependence in Emerging Risks<br>"+
									" <strong style='color:#08345b;'>Abstract:<br></strong> Emerging risks such as cyber-attacks, climate-related events, pandemics, or cascading failures in interconnected systems generate increasingly complex dependence structures that are often difficult to capture using classical dependence coefficients. This talk introduces a new class of copulas, called Lancaster copulas, obtained from the orthogonal expansions characterizing Lancaster probability distributions. Lancaster copulas admit an explicit spectral representation of the copula density, where each coefficient describes dependence along an orthogonal mode. This decomposition provides an interpretable alternative to classical Gaussian or Archimedean copulas. We discuss theoretical properties of the proposed family, including truncation, positivity conditions, dependence measures, tail behavior, and multivariate extensions. Numerical examples illustrate that low-order truncations already provide accurate approximations. We also propose a statistical test for assessing whether the dependence between two random variables is compatible with a Lancaster copula. Such a goodness-of-fit procedure would provide practitioners with a principled tool for deciding when this spectral representation is appropriate for modeling complex dependence structures arising in emerging risk applications.",
						classNames: ['mtalk'],
						},
						{
						title: 'Break',
						start: '2026-11-03T10:45:00',
						end: '2026-11-03T11:15:00',
						backgroundColor: '#E8E8E8',
						borderColor: '#E8E8E8',
						textColor: '#08345b',
						description: 'Coffee Break',
						},
						{
						title: 'José Figueroa-Lopez',
						start: '2026-11-03T11:15:00',
						end: '2026-11-03T11:45:00',
						description: "<strong style='color:#08345b;'>Title:<br></strong> New Market Making Strategies Based on Filling Probabilities and Linear Demand Functions <br>"+
									" <strong style='color:#08345b;'>Abstract:<br></strong> We propose new optimal market making strategies based on filling probabilities and compare their performance to a class of strategies based on linear demand functions. In both cases, a new approach to incorporate correlated asset price dynamics is introduced which leads to market making strategies that adapt to midprice changes online. The proposed methods are tested using real limit order book data. ",
						classNames: ['mtalk'],
						},	
						{
						title: 'Agathe Fernandes Machado',
						start: '2026-11-03T11:45:00',
						end: '2026-11-03T12:00:00',
						description: "<strong style='color:#08345b;'>Title:<br></strong> Enhancing Transparency of Insurance Pricing Models for Policyholders Using Counterfactual Explanation Techniques <br>"+
									" <strong style='color:#08345b;'>Abstract:<br></strong> Black-box models are increasingly used by insurance companies to provide more personalized premiums and handle high-dimensional data sources such as telematics. However, compared to GLMs, these models lack transparency in their internal mechanisms. Actuarial researchers have therefore largely focused on applying explainable artificial intelligence (XAI) methods to insurance pricing, primarily to support insurer-regulator communication and internal model governance. In contrast, little attention has been paid to the insurer-policyholder relationship, despite policyholders being the primary actors affected by model decisions. In this work, we aim to develop a communication tool for the insurer-policyholder relationship that supports a risk-reduction strategy by providing policyholders with “actionable explanations”, which should (i) be understandable to non-expert users and (ii) enable policyholders to identify concrete actions that can lower their insurance costs. A subclass of XAI methods, known as counterfactual explanations (CEs), is particularly well suited to this objective, as it addresses questions such as: “What minimal changes to my characteristics would reduce my premium from $1,500 to $1,000?” We review existing CE techniques and adapt them to the insurance pricing context, illustrating their application using flood claims data. Finally, we discuss reliability challenges, particularly for high-risk policyholders. To address these challenges, we incorporate a Conformal Prediction constraint into the CE search to ensure that suggested changes are not merely artifacts of the model’s uncertainty in sparsely observed regions of the feature space. ",
						classNames: ['stalk'],
						},
						{
						title: 'Sang Huynh',
						start: '2026-11-03T12:00:00',
						end: '2026-11-03T12:15:00',
						description: "<strong style='color:#08345b;'>Title:<br></strong> A Transport Framework for Demographic-Parity Fair Multi-peril Insurance Prices <br>"+
									" <strong style='color:#08345b;'>Abstract:<br></strong> The Wasserstein barycenter has been extensively studied in the actuarial fairness literature as a tool for achieving demographic parity (DP), particularly in the univariate setting, where its explicit quantile representation allows for tractable computation and transport-based premium adjustments. However, insurance products often provide multiple coverages, resulting in vector-valued premiums for which the computation of multivariate Wasserstein barycenters and their associated transport maps becomes considerably more challenging. We investigate two computationally attractive alternatives: the Sinkhorn barycenter and the Sliced Wasserstein barycenter. We develop transport-based fairness adjustments for multi-peril insurance pricing and examine their theoretical properties, with particular attention to availability of out-of-sample transport maps and the actuarial balance property, which are of importance to the fairness adjustment. Our study provides a framework for extending transport-based fairness from univariate to multivariate insurance pricing, as well as two-sample tests for fairness auditing applications. ",
						classNames: ['stalk'],
						},
		
						{
						title: 'Anis Matoussi',
						start: '2026-11-03T12:15:00',
						end: '2026-11-03T12:45:00',
						description: "<strong style='color:#08345b;'>Title:<br></strong> Numerical Methods and Control  for Climate tail risk in credit and insurance portfolios <br>"+
									" <strong style='color:#08345b;'>Abstract:<br></strong> We propose a numerical framework for the tail risk of credit and insurance portfolios under stochastic climate scenarios consistent with the NGFS narratives. A jump-driven climate state, combining temperature and carbon price, drives cash flows, defaults and ruin, while a multivariate generalized Pareto common shock generates co-defaults and simultaneous catastrophe claims. We combine a polynomial jump-diffusion with closed-form moments and a generative score-based diffusion with jumps and an extreme-value tail, with an explicit error budget. We derive optimal abatement and reinsurance feedbacks, and solve the associated BSDE with jumps up to default or ruin. Numerical experiments quantify the impact of warming on tail risk. This talk  is based on  a joint work with Caroline Hillairet (ENSAE-CREST), Junior Kamdje and Wissal Sabbagh (Le Mans Université).  ",
						classNames: ['mtalk'],
						},

						{
						title: 'Break',
						start: '2026-11-03T12:45:00',
						end: '2026-11-03T14:15:00',
						backgroundColor: '#E8E8E8',
						borderColor: '#E8E8E8',
						textColor: '#08345b',
						description: "Lunch on your own. <a href='Practical.html#lunch' style='color: darkorange; text-decoration: underline;'>Restaurants near the venue</a>",
						},
						{
						title: 'Christa Cuchiero',
						start: '2026-11-03T14:15:00',
						end: '2026-11-03T15:00:00',
						description: "<strong style='color:#08345b;'>Title:<br></strong> Dynamic universal approximation and score-based generative  modeling via entire sig-jump diffusions <br>"+
									" <strong style='color:#08345b;'>Abstract:<br></strong> For the generation of time series data, in particular with non-Markovian dynamics and memory effects, two different approaches can be considered: a forward approach based on path-dependent jump diffusions and a backward approach inspired by score-based generative modeling, relying on time-reversed jump diffusions on path space. Both approaches are intrinsically infinite-dimensional and potentially intractable. We show how this complexity can be overcome by means of entire sig-jump diffusions whose dynamics depend only on finitely many signature components. For the forward approach, we establish a dynamic universal approximation theorem, showing that entire sig-jump diffusions can approximate essentially all path-dependent dynamics driven by semimartingales arbitrarily well. For the backward approach, we develop a score-based generative modeling framework for time series data by considering the time reversal of lifted entire sig-jump diffusions. A key ingredient is a generalized score function, which can be learned by exploiting explicit analytic formulas for the expected signature of entire sig-jump diffusions. ",
						classNames: ['ltalk'],
						},
						{
						title: 'Luis Joel Espinosa Gonzalez',
						start: '2026-11-03T15:00:00',
						end: '2026-11-03T15:15:00',
						description: "<strong style='color:#08345b;'>Title:<br></strong> FOURIER-MALLIAVIN ESTIMATOR FOR GENERAL VOLATILITY PROCESSES <br>"+
									" <strong style='color:#08345b;'>Abstract:<br></strong> This work focuses on the estimation and reconstruction of instantaneous volatility for Itô processes using the Fourier-Malliavin method. The primary objective is to extend this methodology under different integrability schemes to guarantee the convergence of the estimators, as well as their rate of convergence, in both one-dimensional and multidimensional cases. Furthermore, the reconstruction of covolatility paths is established through Cesàro summations, and the theoretical framework is adapted to the empirical setting of discrete observations. ",
						classNames: ['stalk'],
						},
						{
						title: 'Jacob Antici',
						start: '2026-11-03T15:15:00',
						end: '2026-11-03T15:30:00',
						description: "<strong style='color:#08345b;'>Title:<br></strong> Boundedness and Stability of the Constrained Aumann–Shapley Operator in Dependent and Macro-Driven Risk Systems <br>"+
									" <strong style='color:#08345b;'>Abstract:<br></strong>We study the Constrained Aumann-Shapley (CAS) operator as a pathwise functional for tail risk evaluation in dependent and nonlinear settings. While CAS provides a flexible alternative to classical allocation methods, its analytical properties under dependence remain largely unexplored. We establish that the CAS operator defines a linear functional on an admissible subspace of L^2 even under full dependence between risk factors and in the presence of exogenous state variables. The key mechanism is a regularization by conditioning effect: conditioning on a one dimensional projection induces fractional Sobolev regularity of the  conditional regression, which ensures bounded pointwise evaluation along the quantile path. As a consequence, the operator admits a Riesz representation and is Lipschitz continous with respect to perturbations in the payoff. This yields robustness to approximation error and sampling variability, proving a rigorous foundation for numerical implementation and stress testing. These results justify the use of CAS in nonlinear, path dependent risk systems and support its interpretation in settings where tail behavior evolves along a trajectory into the extreme loss region. ",
						classNames: ['stalk'],
						},
						{
						title: 'Emma Kroell',
						start: '2026-11-03T15:30:00',
						end: '2026-11-03T15:45:00',
						description: "<strong style='color:#08345b;'>Title:<br></strong> Model Combination in Risk Sharing under Ambiguity <br>"+
									" <strong style='color:#08345b;'>Abstract:<br></strong> We consider the problem of an agent who faces losses in continuous time over a finite time horizon and may choose to share some of these losses with a counterparty. The agent is uncertain about the true loss distribution and has multiple models for the losses, characterised by a finite set of probability measures. Their goal is to optimize a mean-variance type criterion with model combination under ambiguity through risk sharing. We construct such a criterion using the chi-squared divergence, exploiting a dual representation to expand the state space, yielding a time consistent problem. Assuming a Cramér-Lundberg loss model, we fully characterize the optimal risk sharing contract and the agent’s wealth process under the optimal strategy. We prove that the strategy we obtain is admissible and that the value function satisfies the appropriate verification conditions. Furthermore, we show that the model combination problem is equivalent to the monotone mean-variance problem of Maccheroni et al. (2009) under a composite probability measure that depends on the agent's reference probability measures. Finally, we apply the optimal strategy to an insurance setting in a simulation example and provide numerical illustrations of the results. This is joint work with Sebastian Jaimungal and Silvana Pesenti, both of the University of Toronto. ",
						classNames: ['stalk'],
						},
						{
						title: 'Break',
						start: '2026-11-03T15:45:00',
						end: '2026-11-03T16:15:00',
						backgroundColor: '#E8E8E8',
						borderColor: '#E8E8E8',
						textColor: '#08345b',
						description: 'Coffee Break',
						},
						{
						title: 'Sergio Pulido',
						start: '2026-11-03T16:15:00',
						end: '2026-11-03T16:45:00',
						description: "<strong style='color:#08345b;'>Title:<br></strong> Finite-Dimensional Realizations of Stochastic Volterra Equations <br>"+

									" <strong style='color:#08345b;'>Abstract:<br></strong> Risk prediction lies at the heart of insurance, but increasingly accurate predictions raise difficult questions about discrimination, individualization, and fairness. In this talk, I will survey recent mathematical approaches to measuring, understanding, and mitigating disparities in predictive models, with particular emphasis on optimal transport and Wasserstein geometry. After discussing direct and indirect discrimination, I will show how Wasserstein barycenters provide a natural framework for constructing distributionally fair predictions. I will then turn to the challenges of multiple sensitive attributes, where marginal fairness does not imply joint fairness, and interventions targeting one attribute may increase disparities associated with another. Recent results connect these questions to Hilbert-space variance decompositions, Shapley allocations, and explicit Gaussian models of fairness externalities. Finally, I will discuss the relationship between distributional fairness and actuarial calibration, and explain why fair predictions do not necessarily translate into fair insurance prices. The broader question is how improved risk prediction should affect the sharing of risks across individuals and populations.",

									" <strong style='color:#08345b;'>Abstract:<br></strong>  Emerging climate risks are usually modeled as instantaneous events: a tornado, a flood or a hailstorm strikes, and damage follows. Clay shrink-swell (CSS), one of the costliest natural hazards in France, does not fit this mold. Clay soils swell in winter and shrink in summer, and foundations crack only after several seasons of accumulated stress. The risk is latent: the probability of damage this summer depends on the soil’s past. Drawing a parallel with language models, which predict the next word from its context, we show how attention mechanisms can give risk models this missing memory. We adapt the Temporal Fusion Transformer to CSS risk and show, on simulated claims in six French departments, that its interpretable attention weights point back to past recharge seasons. We then discuss the modeling choices this raises for insurers (time step, spatial resolution, memory length, mutualization versus specialization). We close with open questions on the interpretability of such black-box models. ",

									" <strong style='color:#08345b;'>Abstract:<br></strong> Claims reserving in non-life insurance traditionally relies on aggregated data organized into run-off triangles and methods such as Chain Ladder. However, aggregation results in information loss that may affect the estimation of incurred but not reported (IBNR) claims, particularly for recent accident years. In contrast, Triangle-Free Reserving (TFR) directly exploits individual claim data and models the different components of the claims process separately. This study develops the TFR methodology for IBNR estimation, in terms of both claim frequency and amount, and compares its performance with triangle-based methods within a controlled simulation framework. A granular non-life insurance portfolio is simulated at the individual claim level, including claim occurrence, reporting delays, ultimate claim amounts, and the settlement process, under different assumptions regarding frequency, severity, and reporting delays. Particular attention is paid to the reporting delay distribution, whose observation is subject to truncation at the valuation date since only claims reported by that date are observable. Building on Herbst’s approach for truncated data, we construct a corrected estimator combining inverse-probability-of-observation weighting with an estimate of the probability mass beyond the observable window. This estimator is incorporated into TFR to estimate ultimate claim frequency, while severity is modelled from individual claim amounts and combined with projected frequencies to estimate the IBNR reserve. Using the same simulated portfolios, run-off triangles are constructed and Chain Ladder is applied with and without tail extrapolation. Performance is assessed through Monte Carlo simulations using bias, root mean square error (RMSE), predictive uncertainty, and distributional goodness-of-fit measures. The results show that improved estimation of the reporting delay distribution leads to more accurate IBNR reserves than a naive empirical approach. Across the simulated scenarios considered, TFR provides more accurate estimates of IBNR claim frequency than the Chain Ladder methods considered. This improvement also extends to monetary reserving, with the TFR reserve distribution more closely reproducing the true simulated IBNR distribution. This distributional agreement is supported by RMSE as well as Kolmogorov–Smirnov and Anderson–Darling measures. Overall, the results highlight the value of individual claim information and appropriate reporting delay modelling for IBNR reserving. Future research will investigate dependence structures among the components of the claims process, extend the methodology to IBNER (Incurred But not Enough Reserved) to provide a more comprehensive representation of the reserve distribution, explore more complex severity structures, and apply the methodology to real-world non-life insurance data. ",

									" <strong style='color:#08345b;'>Abstract:<br></strong> In this talk, we study prevention in a finite-state Markov-modulated Cramér--Lundberg model, where prevention shortens the time spent in risky regimes of a background Markov process. We distinguish primary from secondary prevention, acting on claim frequency and on claim severity respectively. For the averaged model, in which claim intensities and severities are replaced by their stationary averages over the regimes, we characterize the optimal prevention level, both with zero and with positive initial reserve. As the reserve grows, we relate the optimal level to the maximizer of the Lundberg adjustment coefficient under light-tailed claims, and identify its limit under subexponential claims, where it depends on the regimes carrying the heavy tail. For a two-state model with zero initial reserve, the state-dependent ruin probabilities are explicit up to a single root of a fixed-point equation. We then focus on prevention acting on claim frequency and show that the optimal level when starting in the low-risk state never exceeds the stationary one. Our theoretical results are complemented by numerical experiments. This talk is based on joint work with Mathias Valla (Chaire DIALog, Institut Louis Bachelier, Paris, France).",

									" <strong style='color:#08345b;'>Abstract:<br></strong> We study a broad class of stochastic transport problems under controlled McKean–Vlasov dynamics, allowing control of both drift and volatility, with weak terminal constraints. In contrast to the classical Schrödinger problem, the reference dynamics depend on the evolving law of the process, leading to nonlinear optimization problems on path space, while the terminal constraint is formulated through weak optimal transport, permitting a flexible treatment of distributional targets. This framework encompasses several problems of current interest, including the mean field Schrödinger problem, martingale optimal transport, and Schrödinger–Bass bridges. We establish three main results. First, we prove the existence of optimal controls under general coercivity, continuity, and convexity assumptions. Second, we derive a convex dual representation that extends weak Kantorovich duality and stochastic optimal transport duality to controlled McKean–Vlasov dynamics. Finally, for the mean field Schrödinger problem, we prove convergence, at the level of value functions, of the associated finite-particle Schrödinger bridge problems to the mean field limit, thereby identifying the nonlinear problem as the exact infinite-particle limit of finite-particle Schrödinger bridges. As a byproduct, we establish the existence of an optimal mean field Schrödinger potential, providing a variational foundation for duality in nonlinear stochastic transport. This is joint work with Ludovic Tangpi. ",

									" <strong style='color:#08345b;'>Abstract:<br></strong> On-chain finance is developing rapidly and enables 24/7 operations for buying/selling, lending/borrowing, and swapping, whereas traditional finance only operated during market hours and sometimes with long settlement delays. Our work focuses on lending-borrowing protocols where the calculation of collateral and debt is based on oracle prices, one such example being the Aave protocol with the Chainlink oracle. To better understand the inherent risk in lending-borrowing activity, covariance calculations are required using the available oracle data. The challenge lies in the fact that the price data are asynchronous and are neither in deterministic time form nor in hitting time form. Joint work with Louis Latournerie. ",

									" <strong style='color:#08345b;'>Abstract:<br></strong> This chapter studies how multiple notions of fairness can be incorporated into a single Bayesian non-parametric regression framework for insurance pricing, with a focus on claim frequency modeling under a log-link. We consider a Generalized Gaussian Process Regression (GGPR) model for count data with risk exposure and introduce fairness interventions in its architecture. Specifically, we address notions of individual fairness by altering the kernel structure to control the similarity between policies (e.g., to mitigate omitted variable bias). We also address group-level fairness by enforcing demographic parity through constraints affecting the posterior. This modified GGPR architecture allows us to jointly enforce multiple fairness notions within a single probabilistic model. We empirically explore trade-offs with portfolio balance to prevent systematic overpricing or underpricing at the portfolio level, and how different fairness criteria interact when combined. The results highlight the importance of adopting a multi-criteria, context-aware approach to fairness in insurance pricing. ",

									" <strong style='color:#08345b;'>Abstract:<br></strong> Black-box numerical models can be of great help for the risk and reliability assessment of critical systems. Tracking and understanding the failures of such systems can help avoid potentially dramatic consequences. Reliability-oriented sensitivity analysis aims at measuring how random covariates influences the variability of rare failure events. In particular, a family of methods performs what is known as target sensitivity analysis, i.e., assessing the influence of the model's covariates on the occurrence of a failure event. To this end, recent approaches leverage tools from cooperative game theory (e.g., Shapley-value-type aggregations), with a suitable choice of value function. While traditional estimators rely on sampling strategies, recent methods only require a fixed dataset, effectively bridging the gap between global sensitivity analysis and interpretable machine learning. In this talk, we will show that the target sensitivity analysis value function can be expressed as twice the squared-loss mutual information between two subsets of covariates and the model's output. Leveraging the literature on density ratio estimation, we will use a non-parametric estimator based on a least-squares mutual information scheme cast in a reproducing kernel Hilbert space. Finally, we will compare our method to existing ones and showcase it on classification tasks on real-world datasets. ",

									" <strong style='color:#08345b;'>Abstract:<br></strong> We introduce a class of piecewise deterministic Markov processes with resetting, motivated by self-exciting models of cyber attacks. Under assumptions reminiscent of ruin theory, we prove the existence and uniqueness of an invariant distribution and derive its density explicitly, thereby establishing ergodicity of the process. We then formulate an associated long-run average control problem in which resetting acts as the intervention mechanism. For exponentially distributed jump sizes, the model becomes analytically tractable, allowing an explicit characterization of the invariant distribution and of the optimal intervention policy. With Giorgia Callegaro, Umut Çetin, Bernardo D'Auria",

						description: "<strong style='color:#08345b;'>Title:<br></strong> When Should a Human Take Back Control? Optimal Delegation under Turbulent AI Risk <br>"+
									" <strong style='color:#08345b;'>Abstract:<br></strong>  Deploying AI systems requires deciding when to delegate tasks and when humans should intervene to monitor and mitigate risk. These decisions become particularly challenging when failures cluster: a hallucination or harmful output can trigger further errors, creating periods of elevated risk. We introduce a continuous-time framework for learning adaptive human oversight under such turbulent AI risk. Our model jointly captures incident clustering, its suppression by supervision effort, and the delegation decision. We formulate a stochastic control problem combining human actions, monitoring effort, and switching between human–AI-assisted operation and full AI delegation, balancing operational rewards against oversight costs, cascading failures, and induced uncertainty. Human participation is an endogenous component of risk management: the policy determines both when oversight is needed and how much effort to allocate. We study a relaxed switching formulation and propose Hawkes-PPO, a policy-gradient method that uses a bank of exponential filters of observed incident times as a finite-dimensional summary of the history. In a synthetic environment, it achieves a higher risk-adjusted objective than either fixed regime and approaches an approximate full-information oracle. Numerical experiments illustrate how cascade risks shape intervention and delegation decisions, highlighting the benefits of adaptive switching and supervision for reducing risks and costs.",

									" <strong style='color:#08345b;'>Abstract:<br></strong> This work introduces a model for the prevention and mitigation of cyber risks in networked systems using a risk-averse approach based on spectral criteria. An initial graph is subject to external cyber attacks, modeled by a Susceptible-Infected-Susceptible (SIS) Markov process with controlled infection and recovery rates. We consider the problem of minimizing the risk associated with the evolving structure of the network by employing self-protection and self-insurance efforts, as well as purchasing insurance coverage. We introduce spectral criteria—dependent on the eigenvalues of the graph Laplacian at final time $T$—for which we establish monotonicity in the sense of first‐order stochastic dominance and continuity with respect to the Wasserstein distance. This framework enables us to prove the existence of minimizers for two general optimization problems under consideration: the cases of global and local self-protection. We illustrate our theoretical findings by numerical simulations. ",

						description: "<strong style='color:#08345b;'>Title:<br></strong> Stable measure transformations for affine jump-diffusion <br>"+
									" <strong style='color:#08345b;'>Abstract:<br></strong> Affine processes are Markov processes whose characteristic functions admit an exponentially affine dependence on the initial state. This structural property underlies their widespread use in applications, as it ensures a balance between model flexibility and analytical tractability. This naturally raises the question of whether the affine property is stable under changes to equivalent probability measures. In this work, we provide a full characterization of the class of locally equivalent probability measures that preserve the affine structure in a general affine jump–diffusion setting. Building on the methodological framework developed for general Markov processes, we exploit the additional affine structure to derive necessary and sufficient conditions on admissible transformations. Our results yield an explicit and verifiable criterion, enhancing the applicability of our work across multiple areas, especially in finance and actuarial science.",

						description: "<strong style='color:#08345b;'>Title:<br></strong> Forward utilities in switching markets: a deep learning approach <br>"+
									" <strong style='color:#08345b;'>Abstract:<br></strong> In this talk, we introduce two neural-network-based numerical schemes for solving systems of coupled ergodic Backward Stochastic Differential Equations (eBSDEs). They are motivated by the approximation of forward utilities and optimal strategies in a regime-switching stochastic factor model, where homothetic forward utilities are represented by systems of eBSDEs. We first show that the solution of the system of ergodic BSDEs coincides with that of a multidimensional BSDE with random terminal time, given by the return time of the positive recurrent stochastic factor. Based on this representation, we propose a locally additive deep learning scheme (LAeBSDE), obtained by minimizing aggregated local error terms. We then present a new algorithm inspired by the Deep Galerkin Method (DGM). It minimizes the residual of the associated ergodic PDE system under the invariant measure of the factor, using a representation of the ergodic cost. Numerical experiments show the accuracy and scalability of both methods, which cross-validate each other. We also illustrate the impact of regime switches on forward preferences and optimal allocations in a bull/bear market. Joint work with G. Broux-Quemerais, S. Kaakaï and A. Matoussi (arXiv:2606.24271).",

									" <strong style='color:#08345b;'>Abstract:<br></strong> We construct and analyze dynamic groundwater markets. Economic agents receive stochastic water allocations each period and make competitive decisions on water consumption in order to produce a basket of agricultural goods. The allocations are coupled through the common global groundwater recharge process. Agents can trade their groundwater rights at the endogenous market-clearing price or bank them for future periods. We define the discrete-time non-zero-sum game and develop a dynamic programming algorithm to solve for its sub-game perfect Nash equilibria characterized by the groundwater price process {p(t)}. Numeric case studies illustrate the role of groundwater recharge dynamics, agents' risk aversion, and value of banking, providing insights for environmental markets design. This is joint work with Igor Cialenco (Illinois Tech).",

									" <strong style='color:#08345b;'>Abstract:<br></strong> We investigate a singular–optimal stopping stochastic control problem driven by self-exciting dynamics governed by a Hawkes process. In the continuous-time setting, we show that the optimization problem reduces to solving a variational partial differential equation  with gradient constraints. We then introduce its discrete-time counterpart, modeled as a Markov Decision Process. We prove that, under an appropriate rescaling procedure, the value function of the discrete-time problem converges to its continuous-time equivalent, implying that the discrete-time optimizers are asymptotically optimal for the continuous-time problem. Finally, we apply these results to an Ornstein-Uhlenbeck stochastic differential equation driven by a Hawkes process with singular control, motivated by optimal power plant investment under cyber threat and we illustrate the theoretical findings through numerical simulations. ",

						description: "<strong style='color:#08345b;'>Title:<br></strong> Min-Max Schrödinger Bridge: consistent generation of Open-High-Low-Close quotes <br>"+
									" <strong style='color:#08345b;'>Abstract:<br></strong> Open-High-Low-Close (OHLC) candlesticks are the standard compressed representation of price evolution over a trading period. A generated candlestick only makes sense if it is internally consistent: the high must dominate the open and close, the low must be dominated by them. Standard generative models that operate directly in the four-dimensional candlestick state space typically do not enforce these order constraints by design and can therefore output invalid samples. We construct a generative model that relies on a continuous stochastic process whose joint distribution of extrema is pinned to the data. OHLC quotes are generated from the extrema of sampled paths, guaranteeing consistent samples by construction. The law of the underlying process is the solution to a constrained relative entropy minimization with respect to Wiener measure, thereby motivating the terminology Min-Max Schrödinger Bridge. We provide an explicit representation of the drift of the optimal process as the conditional expectation of a score function, which we can learn efficiently via neural regression. The training requires the simulation of certain Brownian functionals conditionally on observed extrema, for which we develop specific conditional simulation techniques. We validate the recovery of the target law on a toy dataset. Our construction is likely to be applicable beyond the generation of OHLC financial quotes, and a priori in any situation where the distribution of the maximum and minimum of a dynamic variable is of interest. ",

						description: "<strong style='color:#08345b;'>Title:<br></strong> Optimal Investment under Hawkes Jump Dynamics and Transaction Costs.<br>"+
									" <strong style='color:#08345b;'>Abstract:<br></strong> This paper contributes to the investment-consumption literature by focusing on the presence of large fluctuations clustered in time, a phenomenon frequently observed following financial announcements. We study the optimal investment and consumption problem for a risk-averse investor in a financial market consisting of a single risky asset subject to self-exciting jumps, and in the presence of proportional transaction costs. We demonstrate that the value function can be characterized as the solution to a three-dimensional system of integro-diﬀerential variational inequalities. Furthermore, we show that the problem is equivalent to a two-dimensional double singular control problem, which allows us to characterize the solution using a viscosity approach. We conclude with a numerical analysis that provides a comprehensive comparative statics, shedding light on the evolution of the optimal investment policy during and outside clusters. Our main financial finding is that, following a negative jump, the optimal strategy may involve selling the risky asset, even in the absence of short-selling opportunities. This result contrasts with a large body of the quantitative finance literature, yet aligns with empirical observations. Our model thus captures an endogenous flight-to-quality behavior during clustered jump periods, and a slow recovery toward pre-crisis levels once the cluster ends. This is a joint work with Alexis Houssard (BPCE) and Vathana Ly Vath (ENSIIE)",

									" <strong style='color:#08345b;'>Abstract:<br></strong> We study optimal harvesting problems, where the evolution of the biomass is modelled using a general diffusion. In this talk, we will study different approaches to optimal harvesting and its impact towards sustainability. We start by introducing the classical approach where the population is susceptible to extinction due to excessive harvesting, then we present an extension where the harvester is required to seed the population to prevent it from becoming extinct; and, finally, an ergodic formulation of the problem that aims to preserve the long-term stability of the population. ",

									" <strong style='color:#08345b;'>Abstract:<br></strong> This paper studies proportional risk sharing at claim occurrence time in community-based insurance. Each participant is modeled by an individual Cramér–Lundberg surplus process, and, whenever a claim is reported within the pool, its cost is redistributed according to a fixed allocation matrix. We compare the infinite-time ruin probability of each participant under stand-alone operation and under pool participation. Our main result shows that pooling reduces, for every participant, the infinite-time ruin probability when claim severities belong to a common scale family, the allocation rule satisfies full allocation and actuarial fairness, and each transfer remains bounded by an individual capacity condition. The proof relies on a convex-order comparison between the losses borne inside the pool and the corresponding stand-alone losses. We also clarify the role of these assumptions by showing that, outside this framework, pooling need not be beneficial for all participants. Numerical illustrations with Exponential and LogNormal severities support the theoretical findings and highlight how the design of proportional sharing rules affects solvency. The paper thus provides simple and interpretable sufficient conditions under which transparent linear risk-sharing arrangements improve individual solvency in community-based insurance. This is a joint work with Michel Denuit and Christian Y. Robert. ",
